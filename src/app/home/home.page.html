
<ion-header>
  <ion-toolbar>
    <ion-title>This is a test page</ion-title>
  </ion-toolbar>
</ion-header>



<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" sizeSm="6" sizeMd="4">

            <ion-card-subtitle>This is about about page</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-button fill="outline" [routerLink]="['/about']">About</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeSm="6" sizeMd="4">
        <ion-card>
          <ion-card-header color="danger" >
            <ion-card-title>Services</ion-card-title>
            <ion-card-subtitle>This is about services page</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-card-content></ion-card-content>

            <ion-button fill="outline" [routerLink]="['/services']">Services</ion-button>
          </ion-card-content>
        </ion-card>

      <ion-col size="12" sizeSm="6" sizeMd="4">

          <ion-card-header color="secondary">
            <ion-card-title>Projects</ion-card-title>
            <ion-card-subtitle>This is about projects page</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-card-content></ion-card-content>
            <ion-button fill="outline" [routerLink]="['/projects']">Projects</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" sizeSm="6" sizeMd="4">
        <ion-card>
          <ion-card-header color="tertiary">
            <ion-card-title>Contacts</ion-card-title>
            <ion-card-subtitle>This is about contacts page</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
