
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center" style="font-size: 40px; font-weight: bold;">Projects</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list>
    @for (project of (projects | async); track project.id) {
      <ion-item lines="full">
        <ion-thumbnail slot="start">
          <img [src]="project.thumbnail" [alt]="project.title"/>
        </ion-thumbnail>

        <ion-label>
          <h2> {{ project.title }} </h2>
          <p>{{project.price}}</p>
          
        </ion-label>
      </ion-item>
    }
  </ion-list>

</ion-content>
