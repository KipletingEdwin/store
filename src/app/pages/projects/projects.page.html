
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center" style="font-size: 40px; font-weight: bold;">Projects</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding-vertical">
  <ion-grid>
    <ion-row>
      @for (project of (projects | async); track project.id) {
        <ion-col size="12" sizeMd="6" sizeLg="4">
          <ion-card style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
            <img [src]="project.thumbnail" [alt]="project.title" style="width: 100%; height: 200px; object-fit: cover;"/>

            <!-- Product Headers -->
            <ion-card-header>
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <ion-card-title style="font-size: 1.1rem; font-weight: bold;">
                  {{ project.title }}
                </ion-card-title>
                <ion-badge color="success" style="font-size: 0.9rem; padding: 6px 10px;">
                  ${{ project.price }}
                </ion-badge>
              </div>
              <ion-card-subtitle>
                {{ project.category }} . {{ project.brand }}
              </ion-card-subtitle>
            </ion-card-header>

            <!-- Product Summary Content -->
             <ion-card-content style="flex-grow: 1;">
              <p style="line-height: 1.4;  color: var(--ion-color-step-600); ">
                {{ project.description }}
              </p>
             </ion-card-content>

             



          </ion-card>

        </ion-col>
      }

    </ion-row>
  </ion-grid>

</ion-content>
