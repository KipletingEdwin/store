<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center" style="font-size: 40px; font-weight: bold;" >Contact Us</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card color="light" class="ion-margin-bottom">
    <ion-card-header>
      <ion-card-title style="font-weight: bold;">Get in Touch</ion-card-title>
      <ion-card-subtitle>We would love to hear from you</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none" style="background: transparent;">
        <ion-item>
          <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
          <ion-label>+1 (234) 567-890</ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
          <ion-label>support@example.com</ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
          <ion-label>123 Corporate Blvd, Suite 100</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <form (ngSubmit)="submitMessage()" >
    <h5 style="margin-left: 8px; font-weight: bold; margin-top: 25px;">Send a Message</h5>
    <ion-list>
      <ion-item>
        <ion-input
        label="Your Name"
        labelPlacement="stacked"
        type="text"
        placeholder="John Doe"
        name="name"
        [(ngModel)]="contactForm.name"
        required
        >
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
        label="Email Address"
        labelPlacement="stacked"
        type="email"
        placeholder="john@example.com"
        name="email"
        [(ngModel)]="contactForm.email"
        required
        >
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-select
        label="Subject"
        labelPlacement="stacked"
        placeholder="Select an option"
        name="subject"
        [(ngModel)]="contactForm.subject"
        required
        >
        <ion-select-option value="support" >Customer Support</ion-select-option>
        <ion-select-option value="sales" >Sales & Inquiries</ion-select-option>
        <ion-select-option value="feedback" >Product Feedback</ion-select-option>

        </ion-select>
      </ion-item>



    </ion-list>
  </form>






</ion-content>
